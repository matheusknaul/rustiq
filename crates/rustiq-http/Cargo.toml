[package]
name = "rustiq-http"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "form", "multipart", "query"] }
rustiq-core = { version = "0.1.0", path = "../rustiq-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
