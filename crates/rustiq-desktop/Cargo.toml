[package]
name = "rustiq-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
reqwest = "0.13.5"
rustiq-core = { version = "0.1.0", path = "../rustiq-core" }
rustiq-http = { version = "0.1.0", path = "../rustiq-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
