[package]
name = "rustiq-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
reqwest = "0.13.5"
rustiq-core = { version = "0.1.0", path = "../rustiq-core" }
rustiq-http = { version = "0.1.0", path = "../rustiq-http" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
aes-gcm = { version = "0.11", features = ["getrandom", "zeroize"] }
base64 = "0.22"
keyring-core = "1.1"
sha2 = "0.11"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
directories = "6"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
